kind: Deployment

metadata:
  name: springboot-k8s-demo

  namespace: jenkins


spec:

  replicas: 3

  selector:
    matchLabels:
      app: springboot-k8s-demo

  template:

    metadata:
      labels:
        app: springboot-k8s-demo

    spec:

      containers:

        - name: springboot-k8s-demo

          image: myspring:1.0

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8080
